<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 1rem; }
    #reader { width: 100%; max-width: 400px; margin: auto; }
    #status { margin-top: 1rem; font-weight: bold; }
    button { font-size: 1.2rem; padding: 0.75rem 2rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <h3>Scan QR Code</h3>
  <button id="startBtn" onclick="startScan()">Tap to Start Camera</button>
  <div id="reader"></div>
  <div id="status"></div>

  <script>
    // PASTE YOUR DEPLOYED APPS SCRIPT WEB APP URL HERE
    var API_URL = "https://script.google.com/macros/s/your_deployed_script_here/exec";

    function startScan() {
      document.getElementById("startBtn").style.display = "none";
      document.getElementById("status").textContent = "Starting camera...";

      var scanner = new Html5Qrcode("reader");
      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        function(text) {
          scanner.stop();
          document.getElementById("status").textContent = "Scanned: " + text;
          fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ text: text })
          }).then(function() {
            document.getElementById("status").textContent = "Saved: " + text;
            document.getElementById("startBtn").textContent = "Scan Another";
            document.getElementById("startBtn").style.display = "";
          }).catch(function(err) {
            document.getElementById("status").textContent = "Save error: " + err;
            document.getElementById("startBtn").style.display = "";
          });
        }
      ).catch(function(err) {
        document.getElementById("status").textContent = "Camera error: " + err;
        document.getElementById("startBtn").style.display = "";
      });
    }
  </script>
</body>
</html>
